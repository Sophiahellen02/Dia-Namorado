<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para a pessoa amada ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="card">
      <h1>Feliz Dia dos Namorados ❤️</h1>

      <p class="mensagem">
        Hoje eu quero declarar todo o meu amor por você.
        Você é uma pessoa especial, que ilumina meus dias,
        alegra meu coração e torna minha vida muito mais bonita.
      </p>

      <p class="mensagem">
        Cada momento ao seu lado é único. Seu sorriso, seu carinho
        e sua presença fazem tudo ficar melhor.
      </p>

      <button onclick="mostrarDeclaracao()">Clique aqui 💌</button>

      <p id="declaracao"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
